name: Release

on:
  push:
    branches: [main, strong-beta]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:consistency
      - run: npm test --workspace=packages/core
      - run: npx turbo run build --filter=@geotechcli/core
      - run: npx tsc --noEmit
        working-directory: packages/web
      - run: npx turbo run build
      - run: npm run --workspace=@geotechcli/web build:cf
      - run: npm run smoke:web
      - run: test -f packages/cli/dist/index.js && test -f packages/core/dist/index.js

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/strong-beta' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npx turbo run build
      - name: Publish
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-beta:
    name: Deploy beta to Cloudflare
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/strong-beta'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy Worker
        run: npm run --workspace=@geotechcli/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_URL: https://beta.geotechcli.com

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: geotechCLI v${{ steps.version.outputs.version }}
          generate_release_notes: true
