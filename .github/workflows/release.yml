name: Release

on:
  push:
    branches: [main, strong-beta]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node scripts/verify-strong-beta-release.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - run: npm ci
      - run: npm run verify:consistency
      - run: npm test --workspace=packages/core
      - run: npx turbo run build --filter=@geotechcli/core
      - run: npx tsc --noEmit
        working-directory: packages/web
      - run: npx turbo run build
      - run: npm run smoke:fem:draft-run
      - run: npm run smoke:agent-tasks
      - run: npm run --workspace=@geotechcli/web build:cf
      - run: npm run smoke:web
      - run: test -f packages/cli/dist/index.js && test -f packages/core/dist/index.js

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/strong-beta'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Verify trusted publishing toolchain
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Node " + process.versions.node + " is too old for npm trusted publishing");'
          node -e 'const child_process = require("node:child_process"); const version = child_process.execSync("npm --version", { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm " + version + " is too old for npm trusted publishing"); console.log("npm trusted publishing toolchain OK: node " + process.versions.node + ", npm " + version);'
      - run: npx turbo run build
      - name: Publish (dist-tag beta; latest is promoted on main)
        # npm prefers trusted publishing (OIDC) when the registry has a trusted
        # publisher configured for the package being published. That exchange is
        # per-package and fails silently, so a package whose trusted publisher is
        # missing falls back to whatever _authToken setup-node wrote — which is a
        # placeholder unless we supply one. Passing the automation token here keeps
        # publishing working for packages that OIDC cannot cover.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: node scripts/publish-npm-workspaces.mjs --tag beta
      - name: Verify npm package versions (beta dist-tag)
        if: github.ref == 'refs/heads/strong-beta'
        run: |
          EXPECTED_VERSION=$(node -p "require('./packages/core/package.json').version")

          for attempt in $(seq 1 20); do
            CLI_VERSION=$(npm view geotechcli dist-tags.beta 2>/dev/null || true)
            CORE_VERSION=$(npm view @geotechcli/core dist-tags.beta 2>/dev/null || true)

            if [ "$CLI_VERSION" = "$EXPECTED_VERSION" ] && [ "$CORE_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "npm publish verified: dist-tag beta is at $EXPECTED_VERSION"
              exit 0
            fi

            echo "Attempt $attempt/20: waiting for npm dist-tag beta to report geotechcli=$EXPECTED_VERSION and @geotechcli/core=$EXPECTED_VERSION (saw CLI=$CLI_VERSION CORE=$CORE_VERSION)"
            sleep 15
          done

          echo "npm registry did not report the expected beta dist-tag in time."
          exit 1

  deploy-beta:
    name: Deploy beta to Cloudflare
    runs-on: ubuntu-latest
    needs: [verify, publish]
    if: github.ref == 'refs/heads/strong-beta'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy Worker
        run: npm run --workspace=@geotechcli/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_URL: https://beta.geotechcli.com
      - name: Smoke check deployed beta site
        run: |
          export EXPECTED_VERSION=$(node -p "require('./packages/core/package.json').version")
          node <<'NODE'
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedTextModel = 'glm-5.2';
          const expectedVisionModel = 'glm-5v-turbo';
          const expectedLayoutModel = 'glm-ocr';
          const checks = [
            {
              url: `https://beta.geotechcli.com/api/version?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}`;
                }
                if (!payload || payload.version !== expectedVersion) {
                  return `expected version=${expectedVersion}, received ${JSON.stringify(payload)}`;
                }
                if (payload.defaults?.text !== expectedTextModel || payload.defaults?.vision !== expectedVisionModel) {
                  return `expected GLM defaults, received ${JSON.stringify(payload.defaults)}`;
                }
                return null;
              },
              description: `beta version endpoint exposes ${expectedVersion} with GLM defaults`,
            },
            {
              url: `https://beta.geotechcli.com/api/proxy?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.defaults?.text !== expectedTextModel || payload?.defaults?.vision !== expectedVisionModel) {
                  return `expected GLM proxy defaults, received ${JSON.stringify(payload?.defaults)}`;
                }
                return null;
              },
              description: 'beta proxy GET health returns 200 with GLM defaults',
            },
            {
              url: `https://beta.geotechcli.com/api/proxy/layout?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.model !== expectedLayoutModel || payload?.endpoint !== 'layout_parsing') {
                  return `expected GLM-OCR layout health, received ${JSON.stringify(payload)}`;
                }
                return null;
              },
              description: 'beta layout proxy GET health returns 200 with GLM-OCR defaults',
            },
            {
              url: 'https://beta.geotechcli.com/api/proxy',
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-geotech-client': 'geotechcli',
                'x-geotech-client-version': expectedVersion,
              },
              body: JSON.stringify({
                messages: [{ role: 'user', content: 'Reply with exactly: OK' }],
                maxTokens: 16,
                temperature: 0,
              }),
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.model !== expectedTextModel) {
                  return `expected model=${expectedTextModel}, received ${JSON.stringify(payload?.model)}`;
                }
                const content = payload?.choices?.[0]?.message?.content ?? '';
                if (!/OK/i.test(content)) {
                  return `expected OK response, received ${JSON.stringify(content)}`;
                }
                return null;
              },
              description: 'beta proxy live GLM text completion succeeds',
            },
          ];

          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (const check of checks) {
              let lastError = 'unknown error';
              for (let attempt = 1; attempt <= 20; attempt += 1) {
                try {
                  const response = await fetch(check.url, {
                    method: check.method ?? 'GET',
                    redirect: 'follow',
                    headers: check.headers,
                    body: check.body,
                  });
                  const validationError = await check.validate(response);
                  if (!validationError) {
                    console.log(`${check.description}: OK`);
                    lastError = '';
                    break;
                  }
                  lastError = validationError;
                } catch (error) {
                  lastError = error instanceof Error ? error.message : String(error);
                }
                console.log(`Attempt ${attempt}/20 failed for ${check.url}: ${lastError}`);
                await wait(15000);
              }

              if (lastError) {
                throw new Error(`Smoke check failed for ${check.url}: ${lastError}`);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  promote-latest:
    name: Promote npm latest
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Promote the merged version from beta to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          # These used to warn and exit 0. A skipped promotion then looked
          # identical to a successful one, which is how npm latest could sit a
          # version behind production while the job reported green.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_DIST_TAG_TOKEN is not configured, so npm latest cannot be promoted. Create a granular npm automation token (read/write on geotechcli + @geotechcli/core) and add it as the NPM_DIST_TAG_TOKEN repository secret."
            exit 1
          fi

          VERSION=$(node -p "require('./packages/core/package.json').version")
          for PKG in @geotechcli/core geotechcli; do
            PUBLISHED=$(npm view "$PKG@$VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED" != "$VERSION" ]; then
              echo "::error::$PKG@$VERSION is not on npm, so production would ship a version users cannot install. Versions publish from strong-beta releases; check that the strong-beta publish job succeeded for this version."
              exit 1
            fi

            CURRENT_LATEST=$(npm view "$PKG" dist-tags.latest 2>/dev/null || true)
            if [ "$CURRENT_LATEST" = "$VERSION" ]; then
              echo "$PKG latest already points at $VERSION"
              continue
            fi

            npm dist-tag add "$PKG@$VERSION" latest
            echo "$PKG latest -> $VERSION"
          done

  deploy-production:
    name: Deploy production to Cloudflare
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy Worker (production)
        run: npm run --workspace=@geotechcli/web deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_URL: https://www.geotechcli.com
      - name: Smoke check deployed production site
        run: |
          node <<'NODE'
          const base = 'https://www.geotechcli.com';
          const checks = [
            {
              url: `${base}/?ts=${Date.now()}`,
              async validate(response) {
                return response.status === 200 ? null : `unexpected status=${response.status}`;
              },
              description: 'production home returns 200',
            },
            {
              url: `${base}/robots.txt?ts=${Date.now()}`,
              async validate(response) {
                if (response.status !== 200) return `unexpected status=${response.status}`;
                const body = await response.text();
                if (/Disallow:\s*\//i.test(body)) return `robots still disallows indexing: ${body}`;
                if (!/Allow:\s*\//i.test(body)) return `robots missing Allow: /`;
                if (!/Sitemap:/i.test(body)) return `robots missing Sitemap link`;
                return null;
              },
              description: 'production robots.txt allows indexing and links the sitemap',
            },
            {
              url: `${base}/sitemap.xml?ts=${Date.now()}`,
              async validate(response) {
                if (response.status !== 200) return `unexpected status=${response.status}`;
                const body = await response.text();
                if (!body.includes('www.geotechcli.com')) return `sitemap missing www host`;
                return null;
              },
              description: 'production sitemap.xml is reachable with the www host',
            },
          ];

          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (const check of checks) {
              let lastError = 'unknown error';
              for (let attempt = 1; attempt <= 20; attempt += 1) {
                try {
                  const response = await fetch(check.url, {
                    redirect: 'follow',
                    headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                  });
                  const validationError = await check.validate(response);
                  if (!validationError) {
                    console.log(`${check.description}: OK`);
                    lastError = '';
                    break;
                  }
                  lastError = validationError;
                } catch (error) {
                  lastError = error instanceof Error ? error.message : String(error);
                }
                console.log(`Attempt ${attempt}/20 failed for ${check.url}: ${lastError}`);
                await wait(15000);
              }

              if (lastError) {
                throw new Error(`Smoke check failed for ${check.url}: ${lastError}`);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  # Tagging used to be the one release surface with no automation behind it, so
  # GitHub Releases silently froze at v0.4.124 while fourteen versions shipped to
  # npm and to the site. A production push now tags and publishes the release
  # itself rather than waiting for someone to remember.
  tag-release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, promote-latest, deploy-production]
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> $GITHUB_OUTPUT
      - name: Create the release tag if it is missing
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving it alone"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "created $TAG"
      - name: Build release notes from the changelog entry
        run: node scripts/extract-changelog-entry.mjs "${{ steps.version.outputs.version }}" release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: geotechCLI v${{ steps.version.outputs.version }}
          body_path: release-notes.md

  # Final gate: every surface must agree with the version this commit claims.
  verify-surfaces:
    name: Verify published surfaces
    runs-on: ubuntu-latest
    needs: [tag-release]
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git fetch --tags --force
      - run: node scripts/verify-release-surfaces.mjs

  verify-beta-surfaces:
    name: Verify published surfaces (beta)
    runs-on: ubuntu-latest
    needs: [publish, deploy-beta]
    if: github.ref == 'refs/heads/strong-beta'
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/verify-release-surfaces.mjs --channel beta

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> $GITHUB_OUTPUT
      - name: Build release notes from the changelog entry
        run: node scripts/extract-changelog-entry.mjs "${{ steps.version.outputs.version }}" release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: geotechCLI v${{ steps.version.outputs.version }}
          body_path: release-notes.md
