name: Release

on:
  push:
    branches: [main, strong-beta]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node scripts/verify-strong-beta-release.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - run: npm ci
      - run: npm run verify:consistency
      - run: npm test --workspace=packages/core
      - run: npx turbo run build --filter=@geotechcli/core
      - run: npx tsc --noEmit
        working-directory: packages/web
      - run: npx turbo run build
      - run: npm run --workspace=@geotechcli/web build:cf
      - run: npm run smoke:web
      - run: test -f packages/cli/dist/index.js && test -f packages/core/dist/index.js

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/strong-beta' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npx turbo run build
      - name: Publish
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify npm package versions
        if: github.ref == 'refs/heads/strong-beta'
        run: |
          EXPECTED_VERSION=$(node -p "require('./packages/core/package.json').version")

          for attempt in $(seq 1 20); do
            CLI_VERSION=$(npm view geotechcli version 2>/dev/null || true)
            CORE_VERSION=$(npm view @geotechcli/core version 2>/dev/null || true)

            if [ "$CLI_VERSION" = "$EXPECTED_VERSION" ] && [ "$CORE_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "npm publish verified at version $EXPECTED_VERSION"
              exit 0
            fi

            echo "Attempt $attempt/20: waiting for npm registry to report geotechcli=$EXPECTED_VERSION and @geotechcli/core=$EXPECTED_VERSION (saw CLI=$CLI_VERSION CORE=$CORE_VERSION)"
            sleep 15
          done

          echo "npm registry did not report the expected version in time."
          exit 1

  deploy-beta:
    name: Deploy beta to Cloudflare
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/strong-beta'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy Worker
        run: npm run --workspace=@geotechcli/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_URL: https://beta.geotechcli.com
      - name: Smoke check deployed beta site
        run: |
          export EXPECTED_VERSION=$(node -p "require('./packages/core/package.json').version")
          node <<'NODE'
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedTextModel = 'glm-5.1';
          const expectedVisionModel = 'glm-5v-turbo';
          const expectedLayoutModel = 'glm-ocr';
          const checks = [
            {
              url: `https://beta.geotechcli.com/api/version?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}`;
                }
                if (!payload || payload.version !== expectedVersion) {
                  return `expected version=${expectedVersion}, received ${JSON.stringify(payload)}`;
                }
                if (payload.defaults?.text !== expectedTextModel || payload.defaults?.vision !== expectedVisionModel) {
                  return `expected GLM defaults, received ${JSON.stringify(payload.defaults)}`;
                }
                return null;
              },
              description: `beta version endpoint exposes ${expectedVersion} with GLM defaults`,
            },
            {
              url: `https://beta.geotechcli.com/api/proxy?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.defaults?.text !== expectedTextModel || payload?.defaults?.vision !== expectedVisionModel) {
                  return `expected GLM proxy defaults, received ${JSON.stringify(payload?.defaults)}`;
                }
                return null;
              },
              description: 'beta proxy GET health returns 200 with GLM defaults',
            },
            {
              url: `https://beta.geotechcli.com/api/proxy/layout?ts=${Date.now()}`,
              headers: {
                'cache-control': 'no-cache',
                pragma: 'no-cache',
              },
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.model !== expectedLayoutModel || payload?.endpoint !== 'layout_parsing') {
                  return `expected GLM-OCR layout health, received ${JSON.stringify(payload)}`;
                }
                return null;
              },
              description: 'beta layout proxy GET health returns 200 with GLM-OCR defaults',
            },
            {
              url: 'https://beta.geotechcli.com/api/proxy',
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-geotech-client': 'geotechcli',
                'x-geotech-client-version': expectedVersion,
              },
              body: JSON.stringify({
                messages: [{ role: 'user', content: 'Reply with exactly: OK' }],
                maxTokens: 16,
                temperature: 0,
              }),
              async validate(response) {
                const payload = await response.json().catch(() => null);
                if (response.status !== 200) {
                  return `unexpected status=${response.status}, payload=${JSON.stringify(payload)}`;
                }
                if (payload?.model !== expectedTextModel) {
                  return `expected model=${expectedTextModel}, received ${JSON.stringify(payload?.model)}`;
                }
                const content = payload?.choices?.[0]?.message?.content ?? '';
                if (!/OK/i.test(content)) {
                  return `expected OK response, received ${JSON.stringify(content)}`;
                }
                return null;
              },
              description: 'beta proxy live GLM text completion succeeds',
            },
          ];

          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (const check of checks) {
              let lastError = 'unknown error';
              for (let attempt = 1; attempt <= 20; attempt += 1) {
                try {
                  const response = await fetch(check.url, {
                    method: check.method ?? 'GET',
                    redirect: 'follow',
                    headers: check.headers,
                    body: check.body,
                  });
                  const validationError = await check.validate(response);
                  if (!validationError) {
                    console.log(`${check.description}: OK`);
                    lastError = '';
                    break;
                  }
                  lastError = validationError;
                } catch (error) {
                  lastError = error instanceof Error ? error.message : String(error);
                }
                console.log(`Attempt ${attempt}/20 failed for ${check.url}: ${lastError}`);
                await wait(15000);
              }

              if (lastError) {
                throw new Error(`Smoke check failed for ${check.url}: ${lastError}`);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: geotechCLI v${{ steps.version.outputs.version }}
          generate_release_notes: true
